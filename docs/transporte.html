<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte - Portoviejo</title>
  <link rel="stylesheet" href="resources/reset.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="resources/common.css">
  <link rel="stylesheet" href="resources/subpages.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <img src="resources/imagenes/Escudo_de_Portoviejo.png" alt="Escudo de Portoviejo">
    <div class="logo-text">
      <div class="title">PORTOVIEJO</div>
      <div class="subtitle">ALCALDÍA DE PORTOVIEJO</div>
    </div>
  </a>
  <button class="help-btn"><span class="q">?</span> Ayuda</button>
</header>

<main id="contenido">
  <a class="back-link" href="index.html">
    <i class="fa-solid fa-arrow-left"></i>
    Volver al inicio
  </a>

  <div class="page-head">
    <div class="page-icon tone-blue">
      <i class="fa-solid fa-bus"></i>
    </div>
    <h1>Transporte</h1>
    <p class="page-desc">Información sobre vías, tránsito y movilidad en Portoviejo.</p>
  </div>

  <div class="grid">
    <a class="card" href="#">
      <div class="card-icon tone-red">
        <i class="fa-solid fa-road"></i>
      </div>
      <div class="card-name">Portovial</div>
      <div class="card-desc">Estado de vías, señalización y tránsito municipal</div>
    </a>

    <a class="card" href="#">
      <div class="card-icon tone-blue">
        <i class="fa-solid fa-bus"></i>
      </div>
      <div class="card-name">Rutas de Buses</div>
      <div class="card-desc">Horarios y recorridos del transporte público</div>
    </a>
  </div>
</main>

<div class="float-assistant">
  <div class="float-bubble">¿Necesita ayuda? Hable con el asistente</div>
  <button class="float-avatar" aria-label="Activar asistente de voz">
    <i class="fa-solid">
      <img src="resources/imagenes/Avatar3-blanco.png" alt="Avatar">
    </i>
  </button>
</div>

</body>
</html>
