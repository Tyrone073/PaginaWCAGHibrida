<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios para Adultos Mayores de Portoviejo</title>
  <link rel="stylesheet" href="resources/reset.css">
  <link rel="stylesheet" href="resources/style.css">
  <link rel="stylesheet" href="resources/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
  <a class="logo" href="index.html" aria-label="Ir a la página principal">
    <img src="resources/imagenes/Escudo_de_Portoviejo.png" alt="Escudo-Portoviejo">
    <div class="logo-text">
      <p class="title">PORTOVIEJO</p>
      <p class="subtitle">ALCALDÍA DE PORTOVIEJO</p>
    </div>
  </a>
  <button class="help-btn">
    <span class="q" aria-hidden="true">?</span>
    <p>Ayuda</p>
  </button>
</header>

<main>
  <h1>Servicios para<br>Adultos Mayores - Portoviejo</h1>
  <div class="divider">
    <div class="line"></div>
    <div class="dot"></div>
    <div class="line"></div>
  </div>

  <div class="search-wrap">
    <span class="icon">
      <img src="resources/imagenes/lupa.png" alt="" aria-hidden="true">
    </span>

    <label for="buscar" class="sr-only">Buscar servicios</label>
    <input id="buscar" type="text" placeholder="Buscar servicios...">
  </div>

  <div class="categories">
    <a href="salud.html" class="cat-btn cat-salud">
      <i class="fa-solid fa-heart-pulse" aria-hidden="true"></i>
      <p>Salud</p>
    </a>

    <a href="tramites.html" class="cat-btn cat-tramites">
      <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
      <p>Trámites</p>
    </a>

    <a href="transporte.html" class="cat-btn cat-transporte">
      <i class="fa-solid fa-bus" aria-hidden="true"></i>
      <p>Transporte</p>
    </a>
  </div>

  <div class="assistant">
    <div class="bubble">
      <div class="speaker">
        <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
      </div>
      <div>
        <div class="bubble-title">Presione el micrófono y hable</div>
        <div class="bubble-sub">Estoy aquí para ayudarle</div>
      </div>
    </div>

    <div class="mic-wrap">
      <button class="mic-btn" aria-label="Activar microfono">
        <i class="fa-solid fa-microphone" aria-hidden="true"></i>
      </button>
    </div>

    <div class="avatar">
      <img src="resources/imagenes/Avatar3.png" alt="Avatar-Asistente">
    </div>
  </div>

  <div class="footer-bar">
    <div class="shield">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
    </div>
    <p>Información clara, accesible y confiable para usted.</p>
  </div>
</main>

</body>
</html>
