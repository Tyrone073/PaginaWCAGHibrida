<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios para Adultos Mayores - Portoviejo</title>
<link rel="stylesheet" href="resources/reset.css">
<link rel="stylesheet" href="resources/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
  <div class="logo">
    <img src="resources/imagenes/Escudo_de_Portoviejo.png" alt="Escudo de Portoviejo">
    <div class="logo-text">
      <div class="title">PORTOVIEJO</div>
      <div class="subtitle">ALCALDÍA DE PORTOVIEJO</div>
    </div>
  </div>
  <button class="help-btn"><span class="q">?</span> Ayuda</button>
</header>

<main>
  <h1>Servicios para<br>Adultos Mayores - Portoviejo</h1>
  <div class="divider">
    <div class="line"></div>
    <div class="dot"></div>
    <div class="line"></div>
  </div>

  <div class="search-wrap">
    <span class="icon">
      <img src="resources/imagenes/lupa.png" alt="Buscar">
    </span>
    <input type="text" placeholder="Buscar servicios...">
  </div>

  <div class="categories">
    <button class="cat-btn cat-salud">
      <i class="fa-solid fa-heart-pulse"></i>
      Salud
    </button>

    <button class="cat-btn cat-tramites">
      <i class="fa-solid fa-file-lines"></i>
      Trámites
    </button>

    <button class="cat-btn cat-transporte">
      <i class="fa-solid fa-bus"></i>
      Transporte
    </button>
  </div>

  <div class="assistant">
    <div class="bubble">
      <div class="speaker">
        <i class="fa-solid fa-volume-high"></i>
      </div>
      <div>
        <div class="bubble-title">Presione el micrófono y hable</div>
        <div class="bubble-sub">Estoy aquí para ayudarle</div>
      </div>
    </div>

    <div class="mic-wrap">
      <button class="mic-btn" aria-label="Activar micrófono">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>

    <div class="avatar">
      <img src="resources/imagenes/Avatar3.png" alt="Asistente">
    </div>
  </div>

  <div class="footer-bar">
    <div class="shield">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    Información clara, accesible y confiable para usted.
  </div>
</main>

</body>
</html>
